<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WeatherWise live weather and five-day forecast dashboard">
  <title>WeatherWise - Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="logo">☁️ WeatherWise</div>
      <p>Your daily weather companion</p>
    </header>

    <form id="search-form" class="search">
      <input
        id="city-input"
        type="text"
        placeholder="Enter a city, e.g. Kochi"
        aria-label="City name"
        autocomplete="off"
        required
      >
      <button id="search-button" type="submit">Search</button>
    </form>

    <p id="status" role="status" aria-live="polite">
      Search for a city to see its weather.
    </p>

    <section id="weather" hidden>
      <div class="current-card">
        <p class="eyebrow">CURRENT WEATHER</p>
        <h1 id="city-name">City</h1>
        <p id="today-date"></p>

        <div class="current-main">
          <span id="weather-icon" class="weather-icon">☀️</span>
          <div>
            <p id="temperature" class="temperature">--°C</p>
            <p id="condition">Loading...</p>
          </div>
        </div>

        <div class="details">
          <div class="detail">
            <span>Feels like</span>
            <strong id="feels-like">--°C</strong>
          </div>
          <div class="detail">
            <span>Humidity</span>
            <strong id="humidity">--%</strong>
          </div>
          <div class="detail">
            <span>Wind speed</span>
            <strong id="wind">-- km/h</strong>
          </div>
        </div>
      </div>

      <section class="forecast-section">
        <h2>5-Day Forecast</h2>
        <div id="forecast" class="forecast-grid"></div>
      </section>
    </section>

    <footer>
   
      <p> MuID: theerthavijayakumar@mulearn</p>
    </footer>
  </main>
</body>
</html>
